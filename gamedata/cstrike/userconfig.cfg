// engine debug output (1-2 also prints debug text on screen); the S_PSP memory lines and fatal errors reach xash.log regardless
developer 0

// ---- PSP controls ----
// executed after config.cfg on every start, so these always win

// analog stick: move and strafe (engine default on PSP). Stick speed and
// deadzone, look speeds, invert look and auto-aim are in
// Options -> Controls -> Adv. Controls and saved in config.cfg

// face buttons: camera (triangle up, cross down, square left, circle right),
// bound with the d-pad below
// the view stays where it was left instead of drifting back to the center
lookspring 0
lookstrafe 0

// d-pad: up scoreboard (while held), down crouch (toggle), left next weapon,
// right use/reload. Jump is L + cross, change team L + SELECT
// (inside a text menu up/down move the cursor, cross picks, circle closes)
alias +usereload "+use; +reload"
alias -usereload "-use; -reload"
// crouch: one press crouches and stays down, the next one stands up
alias duck_toggle "duck_on"
alias duck_on "+duck; alias duck_toggle duck_off"
alias duck_off "-duck; alias duck_toggle duck_on"
// up, triangle, cross, square, circle and R also have an L combination (see
// below): they are bound once to +psp_* and pick their action when pressed
bind UPARROW +psp_up
bind DOWNARROW duck_toggle
bind LEFTARROW invnext
bind RIGHTARROW +usereload
bind Y_BUTTON +psp_tri
bind A_BUTTON +psp_cross
bind X_BUTTON +psp_square
bind B_BUTTON +psp_circle
bind R1_BUTTON +psp_r

// shoulders: R fire, L combinations (see below)

// ad-hoc: no connection speed test, its 64000 byte answer doesn't fit
// in an ad-hoc packet (config.cfg may still have the old value)
cl_test_bandwidth 0

// ---- performance ----
// frame cap: the time left over is slept, saves battery when the game
// would run faster (menus, quiet moments). Busy scenes are below it anyway
fps_max 45
// smoke puffs after every shot: a sprite and a temp entity each
cl_gunsmoke 0
// rain/snow on the maps that have it
cl_weather 0
// dynamic lights (muzzle flashes, explosions) rebuild lightmaps every frame
r_dynamic 0
// max bullet holes and blood decals kept on the walls
r_decals 30
// player shadows
cl_shadows 0
// corpses stay 2 seconds, then fade out in one
cl_corpsestay 2
// world texture detail with distance: each step up switches to the next
// smaller mipmap (half the resolution) sooner. -7 sharpest, -5 fastest
gl_texture_lodbias -6

// weapon animations come from the server (listen server, no lag): the
// client side prediction cut some reload animations short
cl_lw 0

// ---- SELECT: buy menu (L + SELECT: change team) ----
// Outside a game SELECT still toggles the console.
bind MODE "+psp_select"

// ---- L: secondary attack, and combinations while held ----
// A short press is the secondary attack (zoom, silencer, burst, knife stab).
// Held, the other buttons do something else:
//   L + cross                   jump
//   L + square                  last weapon used
//   L + triangle                drop the current weapon
//   L + circle                  crouch while held (not the toggle)
//   L + up                      grenades (each press: next grenade)
//   L + R                       knife
//   L + SELECT                  change team
// Bindings never change: each button runs its "normal" or "l" action when
// pressed, and its release lets go of everything it could have started, so
// nothing stays held whatever order L and the button are pressed/released.
// Down, left and right keep their normal use while L is held.
// "alias name" alone prints the alias, so "no action" is an empty alias
alias l_none ""
alias l_attack2 "+attack2; wait; wait; -attack2"
alias l_release "l_attack2"
alias l_used "alias l_release l_none"

alias normal_up "+showscores"
alias normal_select "buy"
alias normal_tri "+lookup"
alias normal_cross "+lookdown"
alias normal_square "+left"
alias normal_circle "+right"
alias normal_r "+attack"
alias l_up "l_used; slot4"
alias l_tri "l_used; drop"
alias l_cross "l_used; +jump"
alias l_square "l_used; lastinv"
alias l_select "l_used; chooseteam"
alias l_circle "l_used; +duck; alias circle_rel l_circle_rel"
alias l_r "l_used; slot3"

// L + circle crouch: only its own release stands up, a crouch toggled with
// d-pad down isn't touched by circle; standing up also resets the toggle
alias circle_rel ""
alias l_circle_rel "-duck; alias duck_toggle duck_on; alias circle_rel l_none"

alias mode_normal "alias do_up normal_up; alias do_tri normal_tri; alias do_cross normal_cross; alias do_square normal_square; alias do_circle normal_circle; alias do_r normal_r; alias do_select normal_select"
alias mode_l "alias do_up l_up; alias do_tri l_tri; alias do_cross l_cross; alias do_square l_square; alias do_circle l_circle; alias do_r l_r; alias do_select l_select"
mode_normal

alias +psp_up "do_up"
alias -psp_up "-showscores"
alias +psp_select "do_select"
alias -psp_select ""
alias +psp_tri "do_tri"
alias -psp_tri "-lookup"
alias +psp_cross "do_cross"
alias -psp_cross "-lookdown; -jump"
alias +psp_square "do_square"
alias -psp_square "-left"
alias +psp_circle "do_circle"
alias -psp_circle "-right; circle_rel"
alias +psp_r "do_r"
alias -psp_r "-attack"

// pressing L stops what the buttons were doing (look, turn, fire)
alias +psp_l "-lookup; -lookdown; -left; -right; -attack; alias l_release l_attack2; mode_l"
alias -psp_l "mode_normal; l_release"
bind L1_BUTTON "+psp_l"

// switch weapons right away, no second press to confirm
hud_fastswitch 1

// ---- HUD size ----
// The CS client always uses the 640 wide HUD sprites. hud_scale < 1 gives
// the client a larger virtual screen (480x272 / 0.8 = 600x340) and the
// engine shrinks everything it draws, text included: below ~0.7 menus and
// chat get hard to read. Latched, applied by the "latch" the CS menu runs
// before loading the map.
hud_scale 0.8
