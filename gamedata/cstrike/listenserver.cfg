// Use this file to configure your LISTEN server. 
// This config file is executed everytime the server changes levels.

// disable autoaim
sv_aim 0

// disable clients' ability to pause the server
pausable 0

// default server name. Change to "Bob's Server", etc.
// hostname "Counter-Strike 1.6 Server"

// maximum client movement speed 
sv_maxspeed 320

// 20 minute timelimit
// mp_timelimit 20

sv_cheats 0

// ---- PSP: bots ----
// voice chatter loads a different sound for every phrase and the PSP is
// short on memory; "radio" keeps them to the standard CS radio commands
bot_chatter radio
// the menu sizes maxplayers to bots + 1; auto vacate would keep a slot free
// for another human and leave one bot out
bot_auto_vacate 0
// 0 easy, 1 normal, 2 hard, 3 expert
bot_difficulty 1
